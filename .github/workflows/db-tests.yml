name: DB tests

# Full migration replay + this repo's own SQL test suite, run exactly the way
# supabase/tests/README.md documents: `supabase db reset` against a fresh
# local stack, then every supabase/tests/*.test.sql through psql. Deliberately
# NOT `supabase test db` — pgTAP is not enabled anywhere in this repo's
# migration history, so that command would not run these tests at all.

on:
  push:
  pull_request:

jobs:
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned, not "latest": verified against this exact version before this
      # workflow was written — `supabase --version` reports 2.116.0, `supabase
      # start`, `supabase db reset --local` and their flags below all come
      # from `supabase <cmd> --help` on this version, not memory or docs.
      - name: Install Supabase CLI 2.116.0
        run: npm install -g supabase@2.116.0

      - name: Start local Supabase stack
        run: supabase start

      # Full reset from zero: replays every migration in
      # supabase/migrations/, then runs supabase/seed.sql (db.seed.enabled =
      # true in supabase/config.toml) — not an incremental apply onto
      # whatever `start` happened to seed the containers with.
      - name: Reset local database (full migration replay)
        run: supabase db reset --local

      # supabase/tests/README.md's own loop, kept as close to verbatim as a CI
      # step allows: each file is its OWN psql invocation (one failing
      # assertion must not hide the files after it), ON_ERROR_STOP=1 so a
      # failed `assert` aborts that file rather than continuing past it, and
      # the run prints which files ran and which passed so a run that
      # executed zero files is visibly wrong rather than silently green.
      - name: Run supabase/tests/*.test.sql
        run: |
          set +e
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"

          ran=()
          failed=()
          for f in supabase/tests/*.test.sql; do
            echo "== $f =="
            ran+=("$f")
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "-- FAILED: $f (exit $code)"
              failed+=("$f")
            else
              echo "-- passed: $f"
            fi
          done

          echo ""
          echo "== Summary =="
          echo "Files run: ${#ran[@]}"
          for f in "${ran[@]}"; do echo "  ran:    $f"; done
          echo "Files failed: ${#failed[@]}"
          for f in "${failed[@]}"; do echo "  FAILED: $f"; done

          if [ "${#ran[@]}" -eq 0 ]; then
            echo ""
            echo "No test files matched supabase/tests/*.test.sql — a run that executed" \
                 "nothing is a failure, not a pass."
            exit 1
          fi
          if [ "${#failed[@]}" -ne 0 ]; then
            exit 1
          fi
