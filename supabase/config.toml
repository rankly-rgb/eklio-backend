# Configuration Supabase — repo eklio-backend.
# Ce repo est la source de vérité unique du schéma Eklio (voir README.md).
#
# Organisation Supabase : eklio (mvrhhyusekksnthqumbn)
# Projets rattachés :
#   - fobgdsupyfslxbswfuay  us-east-1  ACTIF — cible des migrations.
#   - enolgemfqeajrwpftppm  eu-west-1  ancien projet, données de test. Conservé
#                                      intact comme filet de sécurité, à retirer
#                                      une fois la bascule US validée. Ne jamais
#                                      y pousser de migration.
#
# Aucun secret dans ce fichier. Les clés (SUPABASE_ACCESS_TOKEN, db password)
# restent hors du repo — voir .gitignore.
#
# Rattacher le projet US : supabase link --project-ref fobgdsupyfslxbswfuay
# Appliquer les migrations : supabase db push
#
# NB : `project_id` ci-dessous est l'identifiant LOCAL du projet (il nomme les
# conteneurs de `supabase start`) ; il ne pilote pas la cible de `db push`.
# Celle-ci vient de `supabase link`, qui écrit le ref dans
# `supabase/.temp/project-ref` — un chemin gitignoré, donc à refaire après
# chaque clone. On aligne quand même `project_id` sur le ref US pour qu'il n'y
# ait qu'une seule valeur à lire dans ce repo.

project_id = "fobgdsupyfslxbswfuay"

[db]
# Doit correspondre à la version des projets Supabase distants (Postgres 17).
major_version = 17

[db.seed]
# `supabase db reset` replays every migration, then runs these files. The
# reference catalogs ship inside a migration (they are production data and must
# reach the hosted project, which seed files never do); seed.sql mirrors them so
# a local reset is self-describing. See the header of supabase/seed.sql.
enabled = true
sql_paths = ["./seed.sql"]

[db.migrations]
enabled = true
schema_paths = []
